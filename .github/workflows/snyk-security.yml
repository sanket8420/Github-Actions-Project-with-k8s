name: Snyk Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snyk:
    runs-on: ubuntu-latest

    # Token at JOB level so every step below can use it
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      # If your Snyk account is on EU hosting, uncomment:
      # SNYK_API: https://api.eu.snyk.io

    permissions:
      contents: read          # for actions/checkout
      security-events: write  # for upload-sarif
      actions: read           # for upload-sarif on private repos

    steps:
      - uses: actions/checkout@v4

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

      # Snyk Open Source needs dependencies resolved first (Python example)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Snyk Code (SAST). "|| true" so findings (exit code 1) don't stop the job
      - name: Snyk Code test
        run: snyk code test --sarif > snyk-code.sarif || true

      # Snyk Open Source (SCA), results go to the Snyk UI
      - name: Snyk Open Source monitor
        run: snyk monitor --all-projects

      # Snyk IaC, results go to the Snyk UI
      - name: Snyk IaC test and report
        run: snyk iac test --report || true

      # Build image for container scanning
      - name: Build Docker image
        run: docker build -t snyk-test-image:${{ github.sha }} .

      # Snyk Container, results go to the Snyk UI
      - name: Snyk Container monitor
        run: snyk container monitor snyk-test-image:${{ github.sha }} --file=Dockerfile

      # Push Snyk Code results to the GitHub Code Scanning tab
      - name: Upload result to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
