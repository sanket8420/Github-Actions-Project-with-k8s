---
name: Java pipeline
on:
  push:
    branches:
      - main
jobs:
  Compile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: compiling
        run: mvn compile
  Security_check:
    runs-on: self-hosted
    needs: Compile
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Resolve Maven dependencies
        run: mvn dependency:resolve
      - name: Trivy Installation
        run: >
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -

          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list

          sudo apt-get update -y

          sudo apt-get install -y trivy
      - name: Trivy FS scan
        run: trivy fs --scanners vuln --skip-version-check --format table -o
          fs-report.txt .
      - name: Gitleaks
        run: sudo apt install gitleaks -y
      - name: Gitleaks Code Scan
        run: gitleaks detect source . -r gitleaks-report.json -f json
  Testing:
    runs-on: self-hosted
    needs: Security_check
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: testing
        run: mvn test
  Building_artifact:
    runs-on: self-hosted
    needs: Testing
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: testing
        run: mvn package
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
  Docker_build_and_docker_compose:
    runs-on: self-hosted
    needs: Building_artifact
    steps:
      - uses: actions/checkout@v4
      - name: Downloading Jar file
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: sanketjadhav84/bankapp:latest
          file: ./Dockerfile
          
      - name: implementing docker compose
        uses: hoverkraft-tech/compose-action@b659c744ee9bed25aea2307c017ad849bd104433
        with:
          compose-file: ./Docker-compose.yaml
