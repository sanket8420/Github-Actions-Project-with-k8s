---
name: Java pipeline
on:
  push:
    branches:
      - main
jobs:
  Compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: compiling
        run: mvn compile
  Security_check:
    runs-on: ubuntu-latest
    needs: Compile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Resolve dependencies
        run: mvn -B -q dependency:resolve
      - name: Trivy FS scan
        run: trivy fs --scanners vuln --skip-version-check --format table -o
          fs-report.txt .
      - name: Gitleaks
        run: sudo apt install gitleaks -y
      - name: Gitleaks Code Scan
        run: gitleaks detect source . -r gitleaks-report.json -f json
